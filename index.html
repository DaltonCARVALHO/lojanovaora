<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NOVAORA — Loja Online</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f7;color:#171717}.cart-button{border:3px solid #f59e0b;background:#ffd400;color:#fff;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer;font-size:16px;box-shadow:0 4px 14px rgba(245,158,11,.55);animation:cartPulse 2s infinite}.cart-button:hover{background:#ffbf00;transform:scale(1.04)}@keyframes cartPulse{0%,100%{box-shadow:0 4px 14px rgba(245,158,11,.55)}50%{box-shadow:0 4px 25px rgba(245,158,11,.95)}}header{background:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}.brand h1{margin:0;font-size:30px;font-weight:900}.brand p{margin:2px 0;color:#16a34a;font-weight:700}.header-right{display:flex;align-items:center;gap:18px}.status{font-size:13px;color:#777}.hero{position:relative;width:100%;min-height:360px;overflow:hidden;background:#d71920}.banner{display:none;width:100%;height:430px;object-fit:cover}.banner.visible{display:block}.hero-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(0,0,0,.12),rgba(0,0,0,.58));color:#fff}.hero-overlay h2{font-size:clamp(34px,5vw,64px);margin:0 0 12px;font-weight:900}.hero-overlay p{font-size:clamp(17px,2vw,24px);margin:0 0 24px}.hero-cta,.buy{display:inline-block;background:#e21b23;color:#fff;text-decoration:none;padding:13px 22px;border-radius:8px;font-weight:800;border:0;cursor:pointer}.hero-default{padding:55px 5%;background:linear-gradient(135deg,#e21b23,#a90008);color:#fff;text-align:center}.hero-default h2{font-size:42px;margin:0 0 12px}.container{width:min(1200px,90%);margin:34px auto}.section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section-title h2{margin:0;font-size:28px}.section-title span{color:#777;font-size:14px}.toolbar{display:flex;gap:12px;margin-bottom:24px}.toolbar input,.toolbar select{padding:13px 14px;border:1px solid #ddd;border-radius:9px;background:#fff;font-size:15px}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:15px;box-shadow:0 5px 18px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px}.card img{width:100%;height:230px;object-fit:contain;border-radius:10px;background:#fafafa}.card h3{font-size:17px;line-height:1.35;margin:2px 0}.small{font-size:13px;color:#777}.price{font-size:24px;font-weight:900;margin-top:auto}.buy{width:100%;text-align:center;font-size:15px}.empty,.error{background:#fff;padding:30px;border-radius:14px;text-align:center}.benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:40px 0}.benefit{background:#fff;border:1px solid #eee;border-radius:12px;padding:20px}.footer{margin-top:40px;background:#171717;color:#bbb;padding:30px 5%;text-align:center}.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}.cart-overlay.open{display:block}.cart-panel{position:absolute;right:0;top:0;height:100%;width:min(430px,100%);background:#fff;display:flex;flex-direction:column}.cart-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid #eee}.cart-items{padding:16px;overflow:auto;flex:1}.cart-item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.cart-item img{width:70px;height:70px;object-fit:contain}.cart-item h4{margin:0 0 5px}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-weight:900}.remove{border:0;background:none;color:#d71920;cursor:pointer;font-size:12px}.cart-total{border-top:1px solid #ddd;padding:18px 20px}.total-row{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-bottom:14px}.checkout{width:100%;padding:14px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-size:16px;font-weight:900}.continue{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff;margin-top:8px;font-weight:800}@media(max-width:700px){.status{display:none}.cart-button{font-size:15px;padding:11px 14px}}
</style></head><body><header><div class="brand"><h1>NOVAORA</h1><p>Loja Online</p></div><div class="header-right"><div class="status">Loja online</div><button class="cart-button" type="button" onclick="openCart()">🛒 Carrinho (<span id="cartCount">0</span>)</button></div></header><section class="hero"><div class="hero-default"><h2>NOVAORA</h2><p>Descubra. Escolha. Compre.</p><a class="hero-cta" href="#produtos">VER OFERTAS</a></div></section><main id="produtos" class="container"><div class="section-title"><h2>🔥 Ofertas em destaque</h2></div><div class="toolbar"><input id="search" placeholder="Pesquisar produtos…"><select id="category"><option value="">Todas as categorias</option></select></div><section id="products" class="grid"></section></main><footer class="footer"><strong>NOVAORA</strong><br>Loja Online · lojanovaora.com</footer><div id="cartOverlay" class="cart-overlay" onclick="if(event.target===this)closeCart()"><aside class="cart-panel"><div class="cart-head"><h2>🛒 Carrinho</h2><button onclick="closeCart()">×</button></div><div id="cartItems" class="cart-items"></div><div class="cart-total"><div class="total-row"><span>Subtotal</span><span id="cartSubtotal">€0,00</span></div><button class="checkout">Finalizar compra</button><button class="continue" onclick="closeCart()">Continuar comprando</button></div></aside></div><script>const DATA_URL='/api/products';let products=[];let cart=JSON.parse(localStorage.getItem('novaora_cart')||'[]');function money(v){return parseFloat(String(v||'').replace(/[^0-9,.-]/g,'').replace(',','.'))||0}function euro(n){return new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n)}function save(){localStorage.setItem('novaora_cart',JSON.stringify(cart));update()}function add(id){const p=products.find(x=>String(x.id??x.name)===String(id));if(!p)return;let x=cart.find(i=>i.id===String(id));if(x)x.qty++;else cart.push({id:String(id),name:p.name,price:money(p.price),qty:1});save();openCart()}function change(id,d){let x=cart.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(i=>i.id!==id);save()}function update(){document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);document.getElementById('cartSubtotal').textContent=euro(cart.reduce((s,x)=>s+x.price*x.qty,0));document.getElementById('cartItems').innerHTML=cart.length?cart.map(x=>`<div class="cart-item"><div>🛍️</div><div><h4>${x.name}</h4><b>${euro(x.price)}</b><div class="qty"><button onclick="change('${x.id}',-1)">−</button><strong>${x.qty}</strong><button onclick="change('${x.id}',1)">+</button></div></div><b>${euro(x.price*x.qty)}</b></div>`).join(''):'<div class="empty"><h3>O carrinho está vazio</h3></div>'}function openCart(){document.getElementById('cartOverlay').classList.add('open');update()}function closeCart(){document.getElementById('cartOverlay').classList.remove('open')}async function load(){try{let r=await fetch(DATA_URL,{cache:'no-store'});products=await r.json();let cats=[...new Set(products.map(p=>p.category).filter(Boolean))];document.getElementById('category').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option>${c}</option>`).join('');render()}catch(e){document.getElementById('products').innerHTML='<div class="error">Erro ao carregar produtos.</div>'}}function render(){let q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('category').value;let list=products.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!c||p.category===c));document.getElementById('products').innerHTML=list.map(p=>`<article class="card"><img src="${p.image||''}" alt="${p.name||'Produto'}"><h3>${p.name||'Produto'}</h3><div class="small">${p.category||''}</div><div class="price">${p.price||''}</div><button class="buy" onclick="add('${String(p.id??p.name).replace(/'/g,"\\'")}')">🛒 COMPRAR</button></article>`).join('')}document.getElementById('search').addEventListener('input',render);document.getElementById('category').addEventListener('change',render);load();update();</script></body></html>
