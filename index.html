<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVAORA — Loja Online</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#171717}header{background:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}.brand h1{margin:0;font-size:30px}.brand::after{content:'LOJA ONLINE';display:block;color:#16a34a;font-size:14px;font-weight:900;margin-top:2px}.cart-button{border:3px solid #f59e0b;background:#ffd400;color:#16a34a;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer;font-size:16px;box-shadow:0 4px 14px rgba(245,158,11,.55)}.hero{width:100%;aspect-ratio:1717/916;background:#fff url('/api/image?url=https%3A%2F%2Fdrive.google.com%2Fuc%3Fexport%3Dview%26id%3D1PBfH2qSsIFWLZNh1Go5Re5FJ0E-EheCA') center center/contain no-repeat}.container{width:min(1200px,90%);margin:34px auto}.section-title h2{margin:0 0 18px;font-size:28px}.toolbar{display:flex;gap:10px;margin-bottom:24px;align-items:center}.search-box{display:flex;flex:1;min-width:220px}.search-box input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:9px 0 0 9px;background:#fff;font-size:15px;height:48px;outline:none}.search-box button{height:48px;border:0;border-radius:0 9px 9px 0;background:#16a34a;color:#fff;padding:0 18px;font-weight:900;cursor:pointer}.toolbar select{padding:13px 14px;border:1px solid #ddd;border-radius:9px;background:#fff;font-size:15px;height:48px;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:15px;box-shadow:0 5px 18px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px}.card img{width:100%;height:230px;object-fit:contain;border-radius:10px;background:#fafafa}.card h3{font-size:17px;line-height:1.35;margin:2px 0}.small{font-size:13px;color:#777}.price{font-size:24px;font-weight:900;margin-top:auto}.buy{width:100%;font-size:15px;background:#e21b23;color:#fff;padding:13px 22px;border-radius:8px;font-weight:800;border:0;cursor:pointer}.empty,.error{background:#fff;padding:30px;border-radius:14px;text-align:center;grid-column:1/-1}.footer{margin-top:40px;background:#171717;color:#bbb;padding:30px 5%;text-align:center}.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}.cart-overlay.open{display:block}.cart-panel{position:absolute;right:0;top:0;height:100%;width:min(430px,100%);background:#fff;display:flex;flex-direction:column}.cart-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid #eee}.cart-items{padding:16px;overflow:auto;flex:1}.cart-item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.cart-item h4{margin:0 0 5px}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-weight:900}.cart-total{border-top:1px solid #ddd;padding:18px 20px}.total-row{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-bottom:14px}.checkout{width:100%;padding:14px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-size:16px;font-weight:900}.continue{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff;margin-top:8px;font-weight:800}@media(max-width:700px){.toolbar{display:block}.search-box{margin-bottom:10px}.toolbar select{width:100%}.hero{aspect-ratio:1717/916}}</style></head><body><header><div class="brand"><h1>NOVAORA</h1></div><button class="cart-button" onclick="openCart()">🛒 Carrinho (<span id="cartCount">0</span>)</button></header><section class="hero" aria-label="Banner NOVAORA"></section><main class="container"><div class="section-title"><h2>🔥 Ofertas em destaque</h2></div><div class="toolbar"><div class="search-box"><input id="search" type="search" placeholder="Pesquisar produto..." autocomplete="off" aria-label="Pesquisar produto"><button id="searchBtn" type="button">ENTER</button></div><select id="category" aria-label="Selecionar categoria"><option value="">Todas as categorias</option></select></div><section id="products" class="grid"></section></main><footer class="footer"><strong>NOVAORA</strong><br>Loja Online · lojanovaora.com</footer><div id="cartOverlay" class="cart-overlay" onclick="if(event.target===this)closeCart()"><aside class="cart-panel"><div class="cart-head"><h2>🛒 Carrinho</h2><button onclick="closeCart()">×</button></div><div id="cartItems" class="cart-items"></div><div class="cart-total"><div class="total-row"><span>Subtotal</span><span id="cartSubtotal">€0,00</span></div><button class="checkout">Finalizar compra</button><button class="continue" onclick="closeCart()">Continuar comprando</button></div></aside></div><script>const DATA_URL='/api/products';let products=[],cart=JSON.parse(localStorage.getItem('novaora_cart')||'[]');const $=id=>document.getElementById(id);function money(v){return parseFloat(String(v||'').replace(/[^0-9,.-]/g,'').replace(',','.'))||0}function euro(n){return new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n)}function imageSrc(u){return u?'/api/image?url='+encodeURIComponent(u):''}function normalize(s){return String(s??'').toLocaleLowerCase('pt-PT').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}function save(){localStorage.setItem('novaora_cart',JSON.stringify(cart));update()}function add(id){const p=products.find(x=>String(x.id??x.name)===String(id));if(!p)return;let x=cart.find(i=>i.id===String(id));if(x)x.qty++;else cart.push({id:String(id),name:p.name,price:money(p.price),qty:1});save();openCart()}function change(id,d){let x=cart.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(i=>i.id!==id);save()}function update(){$('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);$('cartSubtotal').textContent=euro(cart.reduce((s,x)=>s+x.price*x.qty,0));$('cartItems').innerHTML=cart.length?cart.map(x=>`<div class="cart-item"><div>🛍️</div><div><h4>${x.name}</h4><b>${euro(x.price)}</b><div class="qty"><button onclick="change('${x.id}',-1)">−</button><strong>${x.qty}</strong><button onclick="change('${x.id}',1)">+</button></div></div><b>${euro(x.price*x.qty)}</b></div>`).join(''):'<div class="empty"><h3>O carrinho está vazio</h3></div>'}function openCart(){$('cartOverlay').classList.add('open');update()}function closeCart(){$('cartOverlay').classList.remove('open')}function searchProducts(){const q=normalize($('search').value);const terms=q.split(' ').filter(Boolean);const c=normalize($('category').value);const list=products.filter(p=>{const name=normalize(p.name);const category=normalize(p.category);const text=name+' '+category;return(!terms.length||terms.every(t=>text.includes(t)))&&(!c||category===c)});render(list,q);$('products').scrollIntoView({behavior:'smooth',block:'start'})}function render(list=products,q=''){if(!list.length){$('products').innerHTML='<div class="empty"><h3>Produto não encontrado</h3><p>Não encontramos “'+$('search').value+'” na loja.</p></div>';return}$('products').innerHTML=list.map(p=>`<article class="card"><img src="${imageSrc(p.image)}" alt="${p.name||'Produto'}" onerror="this.style.display='none'"><h3>${p.name||'Produto'}</h3><div class="small">${p.category||''}</div><div class="price">${p.price||''}</div><button class="buy" onclick="add('${String(p.id??p.name).replace(/'/g,"\\'")}')">🛒 COMPRAR</button></article>`).join('')}async function load(){try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);products=await r.json();if(!Array.isArray(products))throw Error('Dados inválidos');const cats=[...new Map(products.map(p=>[normalize(p.category),p.category]).filter(([k,v])=>k&&v)).values()];$('category').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option value="${String(c).replace(/"/g,'&quot;')}">${c}</option>`).join('');render()}catch(e){$('products').innerHTML='<div class="error">Erro ao carregar produtos.</div>';console.error(e)}}$('searchBtn').addEventListener('click',searchProducts);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchProducts()}});$('search').addEventListener('search',searchProducts);$('search').addEventListener('input',()=>{if(!$('search').value.trim())render(products,'')});$('category').addEventListener('change',searchProducts);load();update();</script></body></html>
