<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVAORA — Loja Online</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#171717}header{background:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}.brand h1{margin:0;font-size:30px}.brand small{color:#16a34a;font-weight:900}.cart{border:0;background:#ffd400;color:#111;padding:12px 18px;border-radius:10px;font-weight:900;cursor:pointer}.hero{width:100%;aspect-ratio:1717/916;background:#fff url('/api/image?url=https%3A%2F%2Fdrive.google.com%2Fuc%3Fexport%3Dview%26id%3D1PBfH2qSsIFWLZNh1Go5Re5FJ0E-EheCA') center/contain no-repeat}.wrap{width:min(1200px,90%);margin:30px auto}.toolbar{display:flex;gap:10px;margin-bottom:22px}.search{display:flex;flex:1}.search input,.toolbar select{height:46px;border:1px solid #ddd;background:#fff;padding:10px;font-size:15px}.search input{flex:1;border-radius:8px 0 0 8px}.search button{border:0;background:#16a34a;color:#fff;padding:0 18px;border-radius:0 8px 8px 0;font-weight:900;cursor:pointer}.toolbar select{border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:9px}.card img{width:100%;height:220px;object-fit:contain;background:#fafafa;border-radius:10px}.card h3{font-size:17px;line-height:1.35;margin:2px 0}.cat{font-size:13px;color:#777}.price{font-size:24px;font-weight:900;margin-top:auto}.buy,.primary{width:100%;border:0;border-radius:9px;background:#16a34a;color:#fff;padding:13px;font-weight:900;cursor:pointer}.empty{background:#fff;padding:30px;text-align:center;border-radius:12px;grid-column:1/-1}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:50}.overlay.open{display:block}.panel{position:absolute;right:0;top:0;width:min(520px,100%);height:100%;background:#fff;display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #eee}.head button{border:0;background:transparent;font-size:26px;cursor:pointer}.body{padding:20px;overflow:auto}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{width:32px;height:32px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-size:20px;font-weight:900;line-height:1}.qty button:hover{background:#f0fdf4}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding:16px 0}.option{width:100%;text-align:left;border:2px solid #ddd;background:#fff;padding:15px;border-radius:10px;margin-bottom:10px;font-weight:900;cursor:pointer}.option.selected{border-color:#16a34a}.info{display:none;background:#f0faf2;padding:14px;border-radius:9px;margin:-4px 0 12px;line-height:1.5}.info.show{display:block}.form label{display:block;font-weight:800;margin:12px 0 5px}.form input,.form textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit}.form textarea{min-height:90px}.address-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.address-grid .full{grid-column:1/-1}.proof{background:#fff7df;border:1px solid #f0c36d;padding:15px;border-radius:10px;margin:12px 0}.proof input{background:#fff}.summary{background:#f7f7f7;border-radius:10px;padding:14px;margin:15px 0}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #e5e5e5}.bank{background:#fff7df;border:1px solid #f0c36d;padding:15px;border-radius:10px;margin:12px 0}.secondary{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff;font-weight:800;cursor:pointer;margin-top:8px}.success{background:#ecfdf3;border:1px solid #86efac;padding:18px;border-radius:12px;text-align:center}.footer{background:#171717;color:#bbb;padding:30px;text-align:center;margin-top:40px}@media(max-width:700px){.toolbar{display:block}.search{margin-bottom:10px}.toolbar select{width:100%}.address-grid{grid-template-columns:1fr}.address-grid .full{grid-column:auto}}</style></head><body><header><div class="brand"><h1>NOVAORA</h1><small>LOJA ONLINE</small></div><button class="cart" type="button" onclick="openCart()">🛒 Carrinho (<span id="count">0</span>)</button></header><section class="hero"></section><main class="wrap"><h2>🔥 Ofertas em destaque</h2><div class="toolbar"><div class="search"><input id="search" placeholder="Pesquisar produto..." type="search"><button id="searchBtn" type="button">ENTER</button></div><select id="category"><option value="">Todas as categorias</option></select></div><section id="products" class="grid"></section></main><footer class="footer"><strong>NOVAORA</strong><br>Loja Online</footer><div id="cartOverlay" class="overlay"><aside class="panel"><div class="head"><h2>🛒 Carrinho</h2><button type="button" onclick="closeCart()">×</button></div><div id="cartBody" class="body"></div></aside></div><div id="checkoutOverlay" class="overlay"><aside class="panel"><div class="head"><h2>💳 Finalizar compra</h2><button type="button" onclick="closeCheckout()">×</button></div><div class="body"><div id="checkout"></div></div></aside></div><script>const $=id=>document.getElementById(id);let products=[],cart=JSON.parse(localStorage.getItem('novaora_cart')||'[]'),method='';const money=v=>parseFloat(String(v||'').replace(/[^0-9,.-]/g,'').replace(',','.'))||0;const euro=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n);const norm=s=>String(s||'').toLocaleLowerCase('pt-PT').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();function save(){localStorage.setItem('novaora_cart',JSON.stringify(cart));updateCart()}function total(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}function updateCart(){$('count').textContent=cart.reduce((s,x)=>s+x.qty,0)}function add(name){const p=products.find(x=>x.name===name);if(!p)return;const x=cart.find(i=>i.name===name);if(x)x.qty=Number(x.qty||0)+1;else cart.push({name:p.name,price:money(p.price),qty:1});save();openCart()}function addByIndex(index){const p=products[index];if(!p)return;add(p.name)}function changeByIndex(index,d){if(index<0||index>=cart.length)return;const x=cart[index];x.qty=Number(x.qty||0)+Number(d);if(x.qty<1)cart.splice(index,1);save();openCart()}function openCart(){updateCart();$('cartOverlay').classList.add('open');$('cartBody').innerHTML=cart.length?cart.map((x,i)=>`<div class="item"><div><strong>${x.name}</strong><br>${euro(x.price)}<div class="qty"><button type="button" data-qty-index="${i}" data-qty-change="-1">−</button><span>${x.qty}</span><button type="button" data-qty-index="${i}" data-qty-change="1">+</button></div></div><strong>${euro(x.price*x.qty)}</strong></div>`).join('')+`<div class="total"><span>Total</span><span>${euro(total())}</span></div><button class="primary" type="button" id="checkoutButton">Finalizar compra</button>`:'<div class="empty"><h3>Carrinho vazio</h3></div>';document.querySelectorAll('[data-qty-index]').forEach(btn=>btn.addEventListener('click',()=>changeByIndex(Number(btn.dataset.qtyIndex),Number(btn.dataset.qtyChange))));const checkoutButton=$('checkoutButton');if(checkoutButton)checkoutButton.addEventListener('click',openCheckout)}function closeCart(){$('cartOverlay').classList.remove('open')}function openCheckout(){if(!cart.length)return;closeCart();method='';renderCheckout();$('checkoutOverlay').classList.add('open')}function closeCheckout(){$('checkoutOverlay').classList.remove('open')}function selectMethod(m){method=m;renderCheckout()}function renderCheckout(){const bank=method==='bank';$('checkout').innerHTML=`<h3>1. Escolha o método de pagamento</h3><button class="option ${method==='mbway'?'selected':''}" type="button" onclick="selectMethod('mbway')">📱 MB WAY via Stripe</button>${method==='mbway'?'<div class="info show"><strong>Pagamento seguro por Stripe.</strong><br>Ao continuar, será aberto o checkout da Stripe para pagar por MB WAY.</div>':''}<button class="option ${bank?'selected':''}" type="button" onclick="selectMethod('bank')">🏦 Transferência bancária</button>${bank?'<div class="info show"><strong>IBAN:</strong> PT50 3560 0001 9001 8561 4772 7<br><strong>Importante:</strong> confirma sempre a entrada do valor na conta antes de processar a encomenda.</div>':''}<h3>2. Dados do cliente</h3><form class="form" id="orderForm" onsubmit="submitOrder(event)"><label>Nome completo *</label><input id="name" required autocomplete="name"><label>Telefone *</label><input id="phone" required type="tel" autocomplete="tel"><label>E-mail *</label><input id="email" required type="email" autocomplete="email"><label>Morada de entrega *</label><div class="address-grid"><div class="full"><label for="street">Rua / Avenida *</label><input id="street" required autocomplete="street-address" placeholder="Ex.: Rua da Liberdade, 10"></div><div><label for="zone">Zona / Localidade *</label><input id="zone" required autocomplete="address-level2" placeholder="Ex.: Corroios"></div><div><label for="postal">Código postal *</label><input id="postal" required autocomplete="postal-code" inputmode="numeric" placeholder="Ex.: 2855-000" pattern="[0-9]{4}-[0-9]{3}" title="Introduza o código postal no formato 0000-000"></div><div class="full"><label for="address">Morada / Complemento</label><textarea id="address" autocomplete="street-address" placeholder="Apartamento, porta, andar ou outras informações"></textarea></div></div>${bank?'<div class="proof"><strong>📎 Comprovativo de pagamento *</strong><p>Depois de fazer a transferência, envie o comprovativo em PDF, JPG ou PNG (máximo 5 MB).</p><input id="proof" name="comprovativo" type="file" accept="application/pdf,image/jpeg,image/png" required></div>':''}<div class="summary"><strong>Resumo da encomenda</strong>${cart.map(x=>`<div class="row"><span>${x.name} × ${x.qty}</span><strong>${euro(x.price*x.qty)}</strong></div>`).join('')}<div class="total"><span>Total</span><span>${euro(total())}</span></div></div><button class="primary" type="submit" id="submitOrder">${method==='mbway'?'Pagar com MB WAY':'Enviar comprovativo e registar encomenda'}</button><button class="secondary" type="button" onclick="closeCheckout()">Voltar</button></form>`}async function submitOrder(e){e.preventDefault();if(!method){alert('Escolha um método de pagamento.');return}const button=$('submitOrder');button.disabled=true;button.textContent='A enviar...';const data={nome:$('name').value,telefone:$('phone').value,email:$('email').value,rua:$('street').value,zona:$('zone').value,codigoPostal:$('postal').value,morada:$('address').value,total:total(),produtos:cart.map(x=>({name:x.name,unitPrice:x.price,qty:x.qty}))};try{if(method==='mbway'){const r=await fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Não foi possível iniciar o pagamento.');window.location.href=j.url;return}const file=$('proof').files[0];if(!file)throw new Error('Envie o comprovativo de pagamento.');if(file.size>5000000)throw new Error('O comprovativo deve ter no máximo 5 MB.');const form=new FormData();Object.entries(data).forEach(([k,v])=>form.append(k,typeof v==='object'?JSON.stringify(v):v));form.set('produtos',cart.map(x=>`${x.name} x${x.qty}`).join('\n'));form.append('pagamento','Transferência bancária');form.append('comprovativo',file);const r=await fetch('/api/orders',{method:'POST',body:form});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erro ao registar encomenda.');cart=[];save();$('checkout').innerHTML=`<div class="success"><h2>✅ Encomenda registada</h2><p><strong>Nº ${j.orderId}</strong></p><p>O comprovativo foi recebido.</p><div class="bank"><strong>Estado: A aguardar confirmação</strong><br>Vamos confirmar a entrada do valor na conta bancária antes de processar a encomenda.</div><p>Obrigado pela compra na NOVAORA.</p></div>`}catch(err){alert(err.message);button.disabled=false;button.textContent=method==='mbway'?'Pagar com MB WAY':'Enviar comprovativo e registar encomenda'}}function render(list=products){if(!list.length){$('products').innerHTML='<div class="empty"><h3>Produto não encontrado</h3></div>';return}$('products').innerHTML=list.map(p=>`<article class="card"><img src="${p.image?'/api/image?url='+encodeURIComponent(p.image):''}" alt="${p.name||'Produto'}" onerror="this.style.display='none'"><h3>${p.name||'Produto'}</h3><div class="cat">${p.category||''}</div><div class="price">${p.price||''}</div><button class="buy" type="button" onclick="addByIndex(${products.indexOf(p)})">🛒 COMPRAR</button></article>`).join('')}function searchProducts(){const q=norm($('search').value),terms=q.split(' ').filter(Boolean),cat=norm($('category').value);render(products.filter(p=>{const text=norm((p.name||'')+' '+(p.category||''));return(!terms.length||terms.every(t=>text.includes(t)))&&(!cat||norm(p.category)===cat)}))}async function load(){try{const r=await fetch('/api/products',{cache:'no-store'});products=await r.json();const cats=[...new Map(products.map(p=>[norm(p.category),p.category]).filter(x=>x[0])).values()];$('category').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option>${c}</option>`).join('');render()}catch(e){$('products').innerHTML='<div class="empty">Erro ao carregar produtos.</div>'}}$('searchBtn').onclick=searchProducts;$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchProducts()}};$('category').onchange=searchProducts;load();updateCart();if(new URLSearchParams(location.search).get('payment')==='success'){alert('Pagamento enviado. A confirmação final da encomenda será feita pela Stripe.');}</script></body></html>
